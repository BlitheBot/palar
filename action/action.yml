name: Palar Scan
description: >-
  Run Palar, a defensive read-only static analyzer for MCP (Model Context
  Protocol) tool and server definition files, as a CI gate. No network calls,
  no payload generation — it only reads local JSON files and reports findings.
author: BlitheBot
branding:
  icon: shield
  color: purple

inputs:
  version:
    description: >-
      Version of palar to install (any npm version or dist-tag). Ignored
      when `binary` is set. Pinned to an exact version by default: a CI
      gate that can change its verdict without a change in this repository
      is not a gate. Override it to float (`^0.4.0`, `latest`) if you
      would rather pick up new releases automatically.
    required: false
    default: "0.4.0"
  binary:
    description: >-
      An already-built palar executable to run instead of installing from
      npm — either an absolute path or a name on PATH. When set, the install
      step is skipped entirely and `version` is ignored.

      This exists so this repository's own self-test can exercise the build
      from the checkout rather than the last published release: without it,
      a green self-test would say nothing about the code being tested.
      Consumers of the action should leave it unset and take the published
      package.
    required: false
    default: ""
  dir:
    description: Directory to scan for MCP definition files.
    required: false
    default: "."
  fail-on:
    description: >-
      Fail the step if any finding is at or above this severity
      (critical, high, medium, low, info). Unset means findings never
      fail the step.
    required: false
    default: ""
  fail-on-empty:
    description: >-
      Fail the step when no MCP definition files are discovered ("true" /
      "false"). Recommended in CI so a moved scan path fails loudly.
    required: false
    default: "false"
  out:
    description: >-
      If set, write the Markdown report to this path and upload it as a
      workflow artifact.
    required: false
    default: ""
  artifact-name:
    description: Name of the uploaded report artifact (used when out is set).
    required: false
    default: palar-report

outputs:
  exit-code:
    description: Exit code of the palar scan (0 = passed, 1 = gate tripped).
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install palar
      if: inputs.binary == ''
      shell: bash
      run: npm install -g "palar@${{ inputs.version }}"

    - name: Run palar scan
      id: scan
      shell: bash
      env:
        INPUT_BINARY: ${{ inputs.binary }}
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_EMPTY: ${{ inputs.fail-on-empty }}
        INPUT_OUT: ${{ inputs.out }}
      run: |
        # Resolve the executable BEFORE `set +e`, so a bad `binary` input
        # fails this step outright instead of being laundered into the
        # scan's exit code — a missing binary is a misconfiguration, not a
        # gate trip, and the two must not be reported the same way.
        bin="${INPUT_BINARY:-palar}"
        if [ -n "$INPUT_BINARY" ] && ! command -v "$INPUT_BINARY" >/dev/null 2>&1; then
          echo "::error title=palar binary not found::binary input '$INPUT_BINARY' is not an executable file or a command on PATH"
          exit 1
        fi

        set +e
        args=(scan --dir "$INPUT_DIR")
        if [ -n "$INPUT_FAIL_ON" ]; then
          args+=(--fail-on "$INPUT_FAIL_ON")
        fi
        if [ "$INPUT_FAIL_ON_EMPTY" = "true" ]; then
          args+=(--fail-on-empty)
        fi
        if [ -n "$INPUT_OUT" ]; then
          args+=(--out "$INPUT_OUT")
        fi
        "$bin" "${args[@]}"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload report artifact
      if: inputs.out != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.out }}
        if-no-files-found: warn

    - name: Propagate scan exit code
      shell: bash
      run: exit "${{ steps.scan.outputs.exit-code }}"
