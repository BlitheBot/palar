name: Action self-test

on:
  push:
    paths:
      - "action/**"
      - ".github/workflows/action-test.yml"
  workflow_dispatch:

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          dir: examples/fixtures
          fail-on: critical
          fail-on-empty: "true"
          out: mcpguard-report.md
